name: Deploy to Production

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment
        run: |
          URL="${{ vars.PRODUCTION_DEPLOY_URL || secrets.STAGING_DEPLOY_URL }}"
          if [[ -z "$URL" ]]; then
            echo "Error: PRODUCTION_DEPLOY_URL is not set"
            exit 1
          fi
          curl -s -X GET "$URL"
