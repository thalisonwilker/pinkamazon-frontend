name: Trigger Deployment

on:
  push:
    branches:
      - main
      - staging

jobs:
  trigger-get:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook GET
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            URL="${{ vars.PRODUCTION_DEPLOY_URL || secrets.PRODUCTION_DEPLOY_URL }}"
          else
            URL="${{ vars.STAGING_DEPLOY_URL || secrets.STAGING_DEPLOY_URL }}"
          fi
          
          if [[ -z "$URL" ]]; then
            echo "Error: DEPLOY_URL is not set for branch ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "Triggering GET request to $URL..."
          curl -s -X GET "$URL"
